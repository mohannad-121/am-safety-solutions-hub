    <style>
      #ambs-loader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#171c21;transition:opacity .6s ease,visibility .6s ease}
      #ambs-loader.hide{opacity:0;visibility:hidden}
      #ambs-loader .box{text-align:center;width:min(340px,88vw)}
      #ambs-loader svg{width:100%;height:auto;overflow:visible}
      #ambs-loader .a{opacity:0;transform-box:fill-box;animation-duration:4s;animation-iteration-count:1;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.6,0,.3,1)}
      #ambs-loader .col{fill:#8d99a6;transform-origin:bottom;animation-name:grow}
      #ambs-loader .slab{fill:#c9d1d9;transform-origin:left;animation-name:slide}
      #ambs-loader .plat{fill:#f5b301;transform-origin:left;animation-name:slide}
      #ambs-loader .prop{stroke:#f5b301;stroke-width:1.6;fill:none;animation-name:fade}
      #ambs-loader .guard{animation-name:fade}
      #ambs-loader .tower{fill:#8d99a6;transform-origin:bottom;animation-name:grow}
      #ambs-loader .jib{fill:#f5b301;transform-origin:left;animation-name:slide}
      #ambs-loader .cable{stroke:#fff;stroke-width:1;transform-box:view-box;transform-origin:169px 26px;animation-name:cable;animation-timing-function:cubic-bezier(.5,0,.4,1)}
      #ambs-loader .crate{animation-name:drop;animation-timing-function:cubic-bezier(.5,0,.4,1)}
      #ambs-loader .c2{animation-delay:.2s}#ambs-loader .c3{animation-delay:.4s}
      #ambs-loader .s1{animation-delay:.5s}#ambs-loader .s2{animation-delay:.8s}#ambs-loader .s3{animation-delay:1.1s}
      #ambs-loader .tower{animation-delay:.2s}#ambs-loader .jib{animation-delay:.9s}
      #ambs-loader .plat{animation-delay:1.3s}#ambs-loader .prop{animation-delay:1.6s}#ambs-loader .guard{animation-delay:1.8s}
      #ambs-loader .cable,#ambs-loader .crate{animation-delay:1.6s}
      @keyframes grow{0%{opacity:1;transform:scaleY(0)}25%,100%{opacity:1;transform:scaleY(1)}}
      @keyframes slide{0%{opacity:1;transform:scaleX(0)}25%,100%{opacity:1;transform:scaleX(1)}}
      @keyframes fade{0%{opacity:0}25%,100%{opacity:1}}
      @keyframes drop{0%{opacity:1;transform:translateY(-56px)}38%{opacity:1;transform:translateY(0)}43%{transform:translateY(2px)}48%,100%{opacity:1;transform:translateY(0)}}
      @keyframes cable{0%{opacity:1;transform:scaleY(.1)}38%,100%{opacity:1;transform:scaleY(1)}}
      #ambs-loader .brand{margin-top:16px;font:800 clamp(17px,5vw,22px)/1.2 system-ui,Arial,sans-serif;letter-spacing:.08em;color:#fff;display:inline-block;clip-path:inset(0 100% 0 0);animation:type 3s steps(21) .3s forwards;border-bottom:2px solid #f5b301;padding-bottom:6px}
      #ambs-loader .brand b{color:#f5b301}
      #ambs-loader .sub{margin-top:10px;font:500 11px/1.2 system-ui,Arial,sans-serif;letter-spacing:.3em;color:#f5b301;text-transform:uppercase;opacity:0;animation:fade 1s ease 3s forwards}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      #ambs-loader .bar{margin:18px auto 0;width:70%;height:3px;background:#2a323a;border-radius:3px;overflow:hidden}
      #ambs-loader .bar i{display:block;height:100%;width:100%;transform-origin:left;background:#f5b301;border-radius:3px;animation:fill 4s linear forwards}
      @keyframes fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      body.ambs-loading{overflow:hidden}
      @media (prefers-reduced-motion:reduce){#ambs-loader{transition:none}#ambs-loader *{animation-duration:0s!important;animation-delay:0s!important}}
    </style>
  </head>

  <body class="ambs-loading">
    <div id="ambs-loader" role="status" aria-label="Loading AM Building Solutions">
      <div class="box">
        <svg viewBox="0 0 250 175" aria-hidden="true">
          <defs>
            <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M0 0L5 5M5 0L0 5" stroke="#f5b301" stroke-width=".7" fill="none" />
            </pattern>
          </defs>
          <rect x="20" y="160" width="210" height="4" fill="#2a323a" />
          <rect class="a col" x="48" y="52" width="5" height="108" />
          <rect class="a col c2" x="90" y="52" width="5" height="108" />
          <rect class="a col c3" x="132" y="52" width="5" height="108" />
          <rect class="a slab s1" x="40" y="128" width="105" height="6" />
          <rect class="a slab s2" x="40" y="98" width="105" height="6" />
          <rect class="a slab s3" x="40" y="68" width="105" height="6" />
          <rect class="a plat" x="145" y="98" width="60" height="4" />
          <path class="a prop" d="M146 128 L200 102" />
          <g class="a guard">
            <rect x="195" y="84" width="10" height="14" fill="url(#mesh)" />
            <rect x="195" y="84" width="10" height="2" fill="#f5b301" />
            <rect x="203" y="84" width="2" height="16" fill="#f5b301" />
          </g>
          <rect class="a tower" x="222" y="22" width="5" height="138" />
          <rect class="a jib" x="110" y="22" width="125" height="4" />
          <line class="a cable" x1="169" y1="26" x2="169" y2="86" />
          <g class="a crate">
            <rect x="158" y="86" width="22" height="12" fill="#c68a3a" />
            <path d="M158 86L180 98M180 86L158 98" stroke="#171c21" stroke-width="1" opacity=".5" />
            <rect x="158" y="86" width="22" height="12" fill="none" stroke="#171c21" stroke-width="1" />
          </g>
        </svg>
        <div class="brand">AM <b>Building</b> Solutions</div>
        <div class="sub">Safety First</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var loader = document.getElementById('ambs-loader');
        if (!loader) return;
        var start = Date.now();
        var MIN = 4000;
        var finished = false;

        function done() {
          if (finished) return;
          finished = true;
          var wait = Math.max(0, MIN - (Date.now() - start));
          setTimeout(function () {
            loader.classList.add('hide');
            document.body.classList.remove('ambs-loading');
            setTimeout(function () { loader.remove(); }, 700);
          }, wait);
        }

        if (document.readyState === 'complete') done();
        else window.addEventListener('load', done);
        setTimeout(done, 12000);
      })();
    </script>
  </body>
</html>
