    <style>
#ambs-loader{
  --bg:#171c21; --red:#d71920; --gold:#d99a00; --muted:#8d99a5;
  position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 40%,#232b33 0,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .6s ease,visibility .6s;overflow:hidden}
#ambs-loader.hide{opacity:0;visibility:hidden}
#ambs-loader svg.scene{width:min(440px,88vw);height:auto;overflow:visible}
#ambs-loader .steel{fill:none;stroke:#8d99a5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#ambs-loader .thin{fill:none;stroke:#8d99a5;stroke-width:1.5;stroke-linejoin:round}
#ambs-loader .slab{fill:#3a454f}
#ambs-loader .gold{fill:var(--gold)}
#ambs-loader .red{fill:var(--red)}
#ambs-loader .rail{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round}
#ambs-loader .meshline{stroke:var(--gold)}
#ambs-loader .floor{animation:ambs-up .5s var(--t) cubic-bezier(.2,1.3,.4,1) both}
@keyframes ambs-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#ambs-loader .plat{transform-origin:240px 150px;animation:ambs-out .6s 1.95s cubic-bezier(.2,1.2,.4,1) both}
@keyframes ambs-out{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
#ambs-loader .rails{animation:ambs-fade .5s 2.55s both}
@keyframes ambs-fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#ambs-loader .load{animation:ambs-lift 1.5s 2.75s cubic-bezier(.45,0,.25,1) both}
@keyframes ambs-lift{from{transform:translateY(0)}to{transform:translateY(-100px)}}
#ambs-loader .cable{transform-box:fill-box;transform-origin:top;animation:ambs-reel 1.5s 2.75s cubic-bezier(.45,0,.25,1) both}
@keyframes ambs-reel{to{transform:scaleY(.4845)}}
#ambs-loader .crane{animation:ambs-fade .6s 0s both}
#ambs-loader .badge{transform-box:fill-box;transform-origin:center;animation:ambs-badge .5s 4.3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ambs-badge{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}

#ambs-loader .brand{font-size:clamp(19px,5.2vw,31px);letter-spacing:.06em;display:flex;gap:.45em;justify-content:center;flex-wrap:nowrap;white-space:nowrap;min-height:1.3em}
#ambs-loader .brand .w{display:inline-flex}
#ambs-loader .brand .ch{display:inline-block;opacity:0;transform:translateY(12px) scale(.9);filter:blur(5px);animation:ambs-ch .55s var(--d) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ambs-ch{to{opacity:1;transform:none;filter:none}}
#ambs-loader .w1{color:var(--red);font-weight:900}
#ambs-loader .w2{color:var(--gold);font-weight:800}
#ambs-loader .w3{color:#fff;font-weight:300}
#ambs-loader .line{height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold));animation:ambs-ln .9s 2.6s ease forwards}
@keyframes ambs-ln{to{width:min(260px,60vw)}}
#ambs-loader .tag{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);animation:ambs-rise .7s 2.9s both}
@keyframes ambs-rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#ambs-loader .bar{width:min(300px,72vw);height:5px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:6px}
#ambs-loader .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--gold) 10px 20px);background-size:28px 28px;animation:ambs-fb 5s cubic-bezier(.4,0,.2,1) forwards,ambs-st .6s linear infinite}
@keyframes ambs-fb{to{width:100%}}
@keyframes ambs-st{to{background-position:28px 0}}
#ambs-loader .pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.15em}
@media (prefers-reduced-motion:reduce){#ambs-loader *{animation-duration:.01s!important;animation-delay:0s!important}}

    <script>
(function(){
  var DURATION = 5000;     // minimum loader time (ms)
  var TYPE_START = 0.4;    // seconds before the first letter appears
  var TYPE_STEP  = 0.09;   // seconds between letters

  var loader = document.getElementById('ambs-loader');
  var pct = document.getElementById('ambs-pct');
  var brand = document.getElementById('ambs-brand');
  if(!loader) return;

  // build the letters ("AM" red, "Building" gold, "Solutions" white)
  var words = [['AM','w1'],['Building','w2'],['Solutions','w3']], n = 0;
  words.forEach(function(w){
    var el = document.createElement('span'); el.className = 'w ' + w[1];
    w[0].split('').forEach(function(c){
      var s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
      s.style.setProperty('--d', (TYPE_START + n*TYPE_STEP).toFixed(2) + 's');
      el.appendChild(s); n++;
    });
    brand.appendChild(el);
  });

  var timeDone = false, pageLoaded = document.readyState === 'complete';
  document.body.style.overflow = 'hidden';

  function finish(){
    if(!(timeDone && pageLoaded)) return;
    loader.classList.add('hide');
    document.body.style.overflow = '';
    setTimeout(function(){ loader.remove(); }, 700);
  }
  if(!pageLoaded) window.addEventListener('load', function(){ pageLoaded = true; finish(); });

  var start = performance.now();
  (function tick(now){
    var t = Math.min((now - start) / DURATION, 1);
    var e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    pct.textContent = Math.round(e * 100) + '%';
    if(t < 1){ requestAnimationFrame(tick); }
    else { timeDone = true; finish(); }
  })(start);
})();
    </script>
